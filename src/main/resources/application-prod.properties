## Production profile settings - stricter logging
# Activate with: -Dspring-boot.run.profiles=prod or SPRING_PROFILES_ACTIVE=prod

spring.config.activate.on-profile=prod
spring.application.name=BookStoreApplication-ProdProfile

# Keep logs concise in production. Reduce noise from AOP and debug-level messages.
logging.level.root=INFO
logging.level.pjr.bookstore=INFO
# Reduce AOP verbosity in production
logging.level.pjr.bookstore.aop=WARN

