## Development profile settings - enabling DEBUG for AOP and project package
# Activate with: -Dspring-boot.run.profiles=dev or SPRING_PROFILES_ACTIVE=dev

spring.config.activate.on-profile=dev

# Enable debug logging for project packages so AOP debug messages are visible
logging.level.pjr.bookstore=DEBUG
logging.level.pjr.bookstore.aop=DEBUG

